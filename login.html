<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - Lumina AI Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="login.css" rel="stylesheet"/>
</head>
<body>

<header class="header">
  <div class="logo">
    <span>🌿</span>
    <span>Lumina AI Coach</span>
  </div>
</header>

<main class="main">
  <div class="auth-card">

    <div class="card-header">
      <h1>Welcome Back!</h1>
      <p>Sign in to continue your learning journey with Lumina AI Coach.</p>
    </div>

    <div class="demo-credentials" role="note" aria-label="Teacher demonstration login">
      <strong>Teacher demo account</strong>
      <span>Email: <code>demo@lumina.study</code></span>
      <span>Password: <code>Lumina@2026</code></span>
      <button class="google-btn" id="fillDemoBtn" type="button">Use demo credentials</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" placeholder="Enter your email" type="email" required/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input id="password" placeholder="Enter your password" type="password" required/>
          <button aria-label="Toggle password visibility" class="toggle-password" id="togglePassword" type="button">👁</button>
        </div>
      </div>

      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox"/>
          Remember me
        </label>
      </div>

      <button class="submit-btn" type="submit">
        Sign In &#8594;
      </button>
    </form>

    <div class="card-footer">
      Use the teacher demo account above to explore Lumina AI Study Coach.
    </div>

  </div>
</main>

<script>
  const DEMO_EMAIL = 'demo@lumina.study';
  const DEMO_PASSWORD = 'Lumina@2026';

  document.getElementById('togglePassword').addEventListener('click', function () {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('fillDemoBtn').addEventListener('click', function () {
    document.getElementById('email').value = DEMO_EMAIL;
    document.getElementById('password').value = DEMO_PASSWORD;
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    if (email !== DEMO_EMAIL || password !== DEMO_PASSWORD) {
      alert('Please use the teacher demo email and password shown on this page.');
      return;
    }
    sessionStorage.setItem('luminaDemoMode', 'true');
    window.location.href = 'profile-setup.html?demo=1';
  });
</script>

</body>
</html>
